version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ecommerce_db_dev
    restart: always 
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data 

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # DEV HIGHLIGHT: Production code ignore karke Builder stage layega
    container_name: ecommerce_backend_dev
    restart: always
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    volumes:
      # Local image provider writes master + variant-cache files here.
      # Persisted across container restarts; ignored when IMAGE_PROVIDER=s3.
      - uploads_dev:/app/uploads
    
    develop:
      watch:
        # Agar src folder ki koi ts file badle, toh bina container restart kiye usko andar bhej do 
        # (NestJS ka start:dev usko khud detect karke reload kar lega)
        - action: sync
          path: ./src
          target: /app/src
          
        # Agar package.json me naya package add ho, toh container ki poori image automatically REBUILD karo
        - action: rebuild
          path: ./package.json
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

# Persistent volumes
volumes:
  pgdata_dev:
  uploads_dev:
