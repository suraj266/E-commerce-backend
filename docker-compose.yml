version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ecommerce_db_dev
    restart: always 
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data 

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # DEV HIGHLIGHT: Production code ignore karke Builder stage layega
    container_name: ecommerce_backend_dev
    restart: always
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    volumes:
      # Local image provider writes master + variant-cache files here.
      # Persisted across container restarts; ignored when IMAGE_PROVIDER=s3.
      - uploads_dev:/app/uploads
    
    # Migrations are NOT run here — they run as a dedicated one-shot step
    # (see docker-compose.prod.yml `migrate` service and docs/MIGRATIONS.md).
    # This keeps schema changes off the app-boot path and out of a per-replica race.
    command: >
      sh -c "npx prisma generate && npm run start:dev"

# Persistent volumes
volumes:
  pgdata_dev:
  uploads_dev:
